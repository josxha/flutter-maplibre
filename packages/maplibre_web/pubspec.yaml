name: maplibre_web
description: "Web implementation of the Flutter MapLibre plugin."
version: 0.4.0-pre.2
repository: https://github.com/maplibre/flutter-maplibre
issue_tracker: https://github.com/maplibre/flutter-maplibre/issues
homepage: https://maplibre.org/flutter-maplibre
documentation: https://maplibre.org/flutter-maplibre/docs/

platforms: { web: }

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter: { sdk: flutter }
  flutter_web_plugins: { sdk: flutter }
  html: ^0.15.4
  maplibre_platform_interface: ^0.4.0-pre.2
  web: ^1.0.0

dev_dependencies:
  flutter_test: { sdk: flutter }
  very_good_analysis: ^10.0.0

flutter:
  plugin:
    platforms:
      implements: maplibre
      web:
        pluginClass: MapLibrePlugin
        fileName: src/maplibre_plugin.dart
