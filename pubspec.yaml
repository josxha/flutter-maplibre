name: flutter_maplibre
description: "Pub workspace package for Flutter MapLibre."
version: 1.0.0
repository: https://github.com/josxha/flutter-maplibre
issue_tracker: https://github.com/josxha/flutter-maplibre/issues
homepage: https://flutter-maplibre.pages.dev
documentation: https://flutter-maplibre.pages.dev/docs/

publish_to: none
environment:
  sdk: ^3.12.0

workspace:
  - examples
  - packages/maplibre
  - packages/maplibre_native
  - packages/maplibre_native/example
  - packages/maplibre_platform_interface
  - packages/maplibre_web

dev_dependencies:
  pub_semver: ^2.2.0
  yaml: ^3.1.2
  args: ^2.7.0


hooks:
  user_defines:
    # maplibre_native renders through Vulkan on every platform it supports,
    # while the downloaded Android library would default to OpenGL ES.
    maplibre_native_ffi:
      backend: vulkan
