name: maplibre_example
description: "An example app for the MapLibre flutter wrapper."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter: { sdk: flutter }
  flutter_web_plugins: { sdk: flutter }
  geolocator: ^14.0.2
  go_router: ^18.0.0
  http: ^1.2.2
  maplibre: ^0.4.0-pre.1
  maplibre_geolocator: ^0.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test: { sdk: flutter }
  integration_test: { sdk: flutter }
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/styles/
    - assets/geojson/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "../doc/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "../doc/logo.png"
    background_color: "#285DAA"
    theme_color: "#285DAA"