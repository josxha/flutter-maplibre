name: Publish to pub.dev

on:
  push: { tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ] }

jobs:
  maplibre-platform-interface:
    name: "Publish `maplibre_platform_interface`"
    permissions: { id-token: write }
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with: { working-directory: packages/maplibre_platform_interface }
  maplibre-android:
    name: "Publish `maplibre_android`"
    needs: maplibre-platform-interface
    permissions: { id-token: write }
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with: { working-directory: packages/maplibre_android }
  maplibre-ios:
    name: "Publish `maplibre_ios`"
    needs: maplibre-platform-interface
    permissions: { id-token: write }
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with: { working-directory: packages/maplibre_ios }
  maplibre-web:
    name: "Publish `maplibre_web`"
    needs: maplibre-platform-interface
    permissions: { id-token: write }
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with: { working-directory: packages/maplibre_web }
  # maplibre_webview depends on a pre-release of flutter_inappwebview, which
  # makes `dart pub publish --dry-run` exit with a warning. The reusable
  # workflow fails on that, so this job mirrors it without the dry run.
  # `dart pub publish -f` still fails on validation errors.
  maplibre-webview:
    name: "Publish `maplibre_webview`"
    needs: maplibre-platform-interface
    permissions: { id-token: write }
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/maplibre_webview } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
      - uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f
      - name: Install dependencies
        run: dart pub get
      - name: Publish to pub.dev
        run: dart pub publish -f
  maplibre:
    name: "Publish `maplibre`"
    needs:
      - maplibre-platform-interface
      - maplibre-android
      - maplibre-ios
      - maplibre-web
    permissions: { id-token: write }
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with: { working-directory: packages/maplibre }