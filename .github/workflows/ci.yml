  build-web-wasm:
    name: "[Web] Build WASM"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: examples } }
    strategy:
      fail-fast: false
      matrix:
        sdk: [ '3.47.0', '' ]
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: subosito/flutter-action@v2
