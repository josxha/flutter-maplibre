name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Ensure that new pushes/updates cancel running jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-dart:
    name: "[Dart] Check formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: subosito/flutter-action@v2
        with: { cache: true }
      - name: "Get Flutter dependencies"
        run: dart pub get
      - name: Lint analysis
        # git ls-files leaves out the vendored maplibre-native-ffi submodule.
        run: dart format --set-exit-if-changed $(git ls-files '*.dart')
  lints-swift:
    name: "[Swift] Check formatting"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - name: "Format Swift code"
        # The vendored submodule keeps upstream's formatting.
        run: swiftformat --verbose --lint . --exclude packages/maplibre_native/vendor --reporter github-actions-log --swiftversion 6 --disable trailingCommas
  lint-dart:
    name: "[Dart] Static code analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: subosito/flutter-action@v2
        with: { cache: true }
      - name: "Get Flutter dependencies"
        run: dart pub get
      - name: Lint analysis
        run: dart analyze --fatal-warnings --fatal-infos
  lint-kotlin:
    name: "[Kotlin] Code quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - name: ktlint
        uses: ScaCap/action-ktlint@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          filter_mode: nofilter
          file_glob: "!**/*.g.*"
          fail_on_error: true
  unit-test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ '3.47.0', '' ]
        # maplibre_ios and maplibre_webview were replaced by maplibre_native.
        package: [ 'maplibre' ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - name: "Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.sdk }}
          cache: true
      - name: "Get Flutter dependencies"
        run: flutter pub get
      - name: "Run unit tests in package"
        working-directory: packages/${{ matrix.package }}
        run: flutter test --timeout=600s --coverage
      - name: "Run Codecov"
        uses: codecov/codecov-action@v7
        if: ${{ matrix.sdk == '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
